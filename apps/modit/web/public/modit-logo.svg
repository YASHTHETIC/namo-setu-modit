<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 170">
  <style>
    .t { font-family: 'Inter','Arial Black',Helvetica,sans-serif; font-weight: 900; }
  </style>

  <!-- Main text: M O D I T -->
  <text x="0" y="115" class="t" font-size="128" fill="#150726">
    <tspan x="0" dy="0">M</tspan>
  </text>

  <!-- Green circular arrows replacing the O -->
  <g transform="translate(168, 8)">
