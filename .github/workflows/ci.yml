# MODIT CI — every push and PR must stay green before production.
# Backend: full pytest suite. Frontend: unit tests, typecheck, production
# build, image audit. Deploy script syntax checked on every change.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m pytest backend/tests -q

  frontend:
    name: Frontend checks + build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm install --legacy-peer-deps --no-audit --no-fund
      - run: npm run test:unit --workspace=@modit/web
      - run: npm run typecheck --workspace=@modit/web
      - run: npm run check-images
      - run: npm run build --workspace=@modit/web

  deploy-script:
    name: Deploy script syntax
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: bash -n deploy/setup.sh
